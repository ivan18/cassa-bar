                                                .
                                            </button>
                                            <button
                                                onClick={() => setCheckoutModal(prev => ({ ...prev, amountTendered: prev.amountTendered + '0' }))}
                                                className="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-white font-black text-base py-3 rounded-xl transition active:scale-95 shadow"
                                            >
                                                0
                                            </button>
                                            <button
                                                onClick={() => setCheckoutModal(prev => ({ ...prev, amountTendered: prev.amountTendered.slice(0, -1) }))}
                                                className="bg-slate-900 hover:bg-rose-950/60 border border-slate-800 text-rose-400 font-black text-xs py-3 rounded-xl transition active:scale-95 flex items-center justify-center"
                                            >
                                                ⌫
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="sticky -bottom-4 sm:-bottom-5 -mx-4 sm:-mx-5 -mb-4 sm:-mb-5 px-4 sm:px-5 pt-3 pb-4 sm:pb-5 bg-slate-900 border-t border-slate-800">
                                    <button onClick={confirmPayment} disabled={selectedCount === 0} className="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-slate-950 font-black text-sm py-3.5 rounded-2xl transition shadow-lg uppercase tracking-wider">
                                        {selectedCount === 0 ? 'Seleziona cosa incassare' : `CONFERMA INCASSO € ${amountDue.toFixed(2)}`}
                                    </button>
                                </div>
                            </div>
                        </div>
                        );
                    })()}
                </div>
                {report && (
                    <PrintReport
                        report={report}
                        clubName={clubName}
                        registerName={registerName}
                        salesHistory={salesHistory}
                        creditTabs={creditTabs}
                        initialFund={initialFund}
                    />
                )}
                </>
            );
        }

        // Report stampabile (Stampa → Salva come PDF): visibile solo in stampa
        function PrintReport({ report, clubName, registerName, salesHistory, creditTabs, initialFund }) {
            const euro = (v) => `€ ${v.toFixed(2)}`;
            const isClosure = report.kind === 'chiusura';
            const c = report.closure;
            const sales = isClosure ? c.sales : [...salesHistory].reverse();
            const totalSales = isClosure ? c.totalSales : salesHistory.reduce((s, x) => s + x.total, 0);
            const cell = 'border border-gray-400 px-2 py-1 text-left align-top';
            const rows = isClosure ? [
                ['Cassiere', c.cashierName],
                ['Fondo cassa iniziale', euro(c.initialFund)],
                ['Totale incassato', euro(c.totalSales)],
                ['Totale in cassa', euro(c.initialFund + c.totalSales)],
                ['Consegnato al presidente', euro(c.presidentAmount)],
                ['Fondo cassa per il giorno dopo', euro(c.newInitialFundForNextDay)],
                ['Causale', c.reasonNotes],
                ...(c.creditsCreated ? [['Conti passati nei crediti', String(c.creditsCreated)]] : [])
            ] : [
                ['Fondo cassa iniziale', euro(initialFund)],
                ['Totale incassato', euro(totalSales)],
                ['Totale in cassa', euro(initialFund + totalSales)],
                ['Crediti da incassare', euro(creditTabs.reduce((s, x) => s + x.total, 0))]
            ];
            return (
                <div id="report-stampa" className="hidden print:block bg-white text-black text-[11px] p-4 font-sans">
                    <h1 className="text-lg font-black uppercase">{clubName}</h1>
                    <p className="text-gray-600">{registerName} · {isClosure
                        ? `Chiusura cassa del ${c.date} ore ${c.time}`
                        : `Vendite dall'ultima chiusura · stampato il ${new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' })}`}</p>
                    <table className="mt-3 border-collapse">
                        <tbody>
                            {rows.map(([k, v]) => (
                                <tr key={k}><td className={`${cell} font-bold`}>{k}</td><td className={cell}>{v}</td></tr>
                            ))}
                        </tbody>
                    </table>

                    <h2 className="mt-4 text-sm font-black uppercase">Vendite{sales ? ` (${sales.length})` : ''}</h2>
                    {!sales ? (
                        <p className="text-gray-600">Dettaglio non disponibile: chiusura registrata prima della versione 4.2.</p>
                    ) : sales.length === 0 ? (
                        <p className="text-gray-600">Nessuna vendita.</p>
                    ) : (
                        <table className="mt-1 w-full border-collapse">
                            <thead>
                                <tr className="bg-gray-200">
                                    <th className={cell}>Ora</th><th className={cell}>Tavolo</th><th className={cell}>Pagato da</th>
                                    <th className={cell}>Articoli</th><th className={`${cell} text-right`}>Importo</th>
                                </tr>
                            </thead>
                            <tbody>
                                {sales.map((s, i) => (
                                    <tr key={i}>
                                        <td className={cell}>{s.time}</td><td className={cell}>{s.table}</td><td className={cell}>{s.customerName}</td>
                                        <td className={cell}>{itemsText(s.items)}</td><td className={`${cell} text-right`}>{euro(s.total)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}

                    {!isClosure && creditTabs.length > 0 && (
                        <>
                            <h2 className="mt-4 text-sm font-black uppercase">Crediti da incassare ({creditTabs.length})</h2>
                            <table className="mt-1 w-full border-collapse">
                                <thead>
                                    <tr className="bg-gray-200">
                                        <th className={cell}>Del</th><th className={cell}>Tavolo</th>
                                        <th className={cell}>Articoli</th><th className={`${cell} text-right`}>Importo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {creditTabs.map(cr => (
                                        <tr key={cr.creditId}>
                                            <td className={cell}>{cr.closureDate}</td><td className={cell}>{cr.table}</td>
                                            <td className={cell}>{itemsText(cr.items)}</td><td className={`${cell} text-right`}>{euro(cr.total)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
