<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cassa Smart Bar & Pub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        button, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
        @media (max-width: 640px) { input, select { font-size: 16px !important; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_PRODUCTS = [
            { id: 1, name: 'DREHER 66 cl', category: 'Birre', price: 2.00, color: 'bg-amber-500 hover:bg-amber-400 text-slate-950 border-amber-300' },
            { id: 2, name: 'PERONI 66 cl', category: 'Birre', price: 2.00, color: 'bg-red-600 hover:bg-red-500 text-white border-red-400' },
            { id: 3, name: 'BAVARIA 66 cl', category: 'Birre', price: 2.00, color: 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-400' },
            { id: 4, name: 'DREHER 33 cl', category: 'Birre', price: 1.10, color: 'bg-amber-400 hover:bg-amber-300 text-slate-950 border-amber-200' },
            { id: 5, name: 'PERONI 33 cl', category: 'Birre', price: 1.20, color: 'bg-red-500 hover:bg-red-400 text-white border-red-300' },
            { id: 7, name: 'COCA COLA', category: 'Bibite', price: 1.50, color: 'bg-red-900 hover:bg-red-800 text-white border-red-700' },
            { id: 8, name: 'FANTA', category: 'Bibite', price: 1.50, color: 'bg-orange-500 hover:bg-orange-400 text-slate-950 border-orange-300' },
            { id: 12, name: 'GASSOSA', category: 'Bibite', price: 1.00, color: 'bg-teal-500 hover:bg-teal-400 text-slate-950 border-teal-300' },
            { id: 9, name: 'ACQUA 500 ml', category: 'Bibite', price: 0.50, color: 'bg-sky-500 hover:bg-sky-400 text-slate-950 border-sky-300' },
            { id: 10, name: 'PATATINE', category: 'Snack', price: 1.50, color: 'bg-yellow-600 hover:bg-yellow-500 text-white border-yellow-400' },
            { id: 13, name: 'SALATINI', category: 'Snack', price: 0.30, color: 'bg-yellow-500 hover:bg-yellow-400 text-slate-950 border-yellow-300' },
            { id: 11, name: 'CAFFÈ', category: 'Bar', price: 1.00, color: 'bg-stone-700 hover:bg-stone-600 text-amber-200 border-stone-500' }
        ];

        // PIN area protetta: nel codice c'è solo l'hash SHA-256 (salt + PIN), generato da build.mjs
        const PIN_SALT = '__PIN_SALT__';
        const PIN_HASH = '__PIN_HASH__';

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
        }

        const INITIAL_CUSTOMERS = ['Andrea', 'Chiara', 'Giuseppe', 'Luca', 'Marco', 'Matteo', 'Paolo', 'Roberto'];
        // Rimuoviamo Tavolo 7 e Tavolo 8
        const TABLES = ['Banco', 'Tavolo 1', 'Tavolo 2', 'Tavolo 3', 'Tavolo 4', 'Tavolo 5', 'Tavolo 6'];

        function Icon({ name, className = "w-5 h-5" }) {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name.toLowerCase()} className={className}></i>;
        }

        function App() {
            const [activeTab, setActiveTab] = useState('pos');

            // Intestazione Personalizzabile
            const [clubName, setClubName] = useState(() => {
                return localStorage.getItem('cassa_clubName') || 'ASD DON ERBERTO BELLINO APS';
            });
            const [registerName, setRegisterName] = useState(() => {
                return localStorage.getItem('cassa_registerName') || 'CASSA';
            });
            const [isEditingHeader, setIsEditingHeader] = useState(false);

            useEffect(() => { localStorage.setItem('cassa_clubName', clubName); }, [clubName]);
            useEffect(() => { localStorage.setItem('cassa_registerName', registerName); }, [registerName]);

            // Autenticazione Password
            const [authModal, setAuthModal] = useState({
                open: false,
                targetTab: '',
                requiredRole: '',
                passwordInput: '',
                error: ''
            });

            // Persistenza Dati
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('cassa_products');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });
            useEffect(() => { localStorage.setItem('cassa_products', JSON.stringify(products)); }, [products]);

            const [customerList, setCustomerList] = useState(() => {
                const saved = localStorage.getItem('cassa_customerList');
                const list = saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
                return [...list].sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
            });
            useEffect(() => {
                localStorage.setItem('cassa_customerList', JSON.stringify(customerList));
            }, [customerList]);

            const [openTabs, setOpenTabs] = useState(() => {
                const saved = localStorage.getItem('cassa_openTabs');
                return saved ? JSON.parse(saved) : [];
            });
            useEffect(() => { localStorage.setItem('cassa_openTabs', JSON.stringify(openTabs)); }, [openTabs]);

            const [salesHistory, setSalesHistory] = useState(() => {
                const saved = localStorage.getItem('cassa_salesHistory');
                return saved ? JSON.parse(saved) : [];
            });
            useEffect(() => { localStorage.setItem('cassa_salesHistory', JSON.stringify(salesHistory)); }, [salesHistory]);

            // Storico Chiusure Cassa Registrate
            const [dailyClosuresHistory, setDailyClosuresHistory] = useState(() => {
                const saved = localStorage.getItem('cassa_dailyClosuresHistory');
                return saved ? JSON.parse(saved) : [];
            });
            useEffect(() => { localStorage.setItem('cassa_dailyClosuresHistory', JSON.stringify(dailyClosuresHistory)); }, [dailyClosuresHistory]);

            // Fondo Cassa
            const [initialFund, setInitialFund] = useState(() => {
                const saved = localStorage.getItem('cassa_initialFund');
                return saved ? parseFloat(saved) : 50.00;
            });
            useEffect(() => { localStorage.setItem('cassa_initialFund', initialFund.toString()); }, [initialFund]);

            const [activeCategory, setActiveCategory] = useState('TUTTI');
            const [currentDateTime, setCurrentDateTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentDateTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Stato Flusso POS (Nessun socio preselezionato di default)
            const [activeCustomer, setActiveCustomer] = useState('');
            const [selectedTable, setSelectedTable] = useState('Banco');
            const [cart, setCart] = useState([]);

            // Modalità "Servi / Offri a Tutti i Soci Seduti"
            const [applyToAllMembers, setApplyToAllMembers] = useState(false);

            // Mappa dei soci seduti nei vari tavoli
            const [tableMembersMap, setTableMembersMap] = useState(() => {
                const saved = localStorage.getItem('cassa_tableMembersMap');
                return saved ? JSON.parse(saved) : {};
            });
            useEffect(() => {
                localStorage.setItem('cassa_tableMembersMap', JSON.stringify(tableMembersMap));
            }, [tableMembersMap]);

            // Modale Gestione Soci al Tavolo
            const [isManageTableMembersOpen, setIsManageTableMembersOpen] = useState(false);
            const [tableMemberSearch, setTableMemberSearch] = useState('');

            const [newMemberName, setNewMemberName] = useState('');

            // Form Gestione Nuovi Prodotti
            const [prodForm, setProdForm] = useState({ id: null, name: '', category: 'Birre', price: '', color: 'bg-amber-500 hover:bg-amber-400 text-slate-950 border-amber-300' });

            // State Chiusura Cassa Form
            const [closureForm, setClosureForm] = useState({
                cashierName: 'Operatore Cassa',
                presidentAmount: '',
                reasonNotes: 'Consegna Incasso Giornaliero'
            });

            const [checkoutModal, setCheckoutModal] = useState({
                open: false,
                order: null,
                amountTendered: '',
                change: 0,
                selectedCustomerToPay: 'ALL'
            });

            // Calcoli Derivati
            const sortedCustomerList = useMemo(() => {
                return [...customerList].sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
            }, [customerList]);

            const cartTotal = useMemo(() => {
                return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            }, [cart]);

            const totalDailySales = useMemo(() => {
                return salesHistory.reduce((sum, sale) => sum + sale.total, 0);
            }, [salesHistory]);

            const categories = useMemo(() => {
                const cats = ['TUTTI', ...new Set(products.map(p => p.category))];
                return cats;
            }, [products]);

            const filteredProducts = useMemo(() => {
                if (activeCategory === 'TUTTI') return products;
                return products.filter(p => p.category === activeCategory);
            }, [products, activeCategory]);

            // Soci attivi seduti al tavolo selezionato
            const currentSittingMembers = useMemo(() => {
                return tableMembersMap[selectedTable] || [];
            }, [tableMembersMap, selectedTable]);

            // Authenticate admin section
            const handleAuthenticate = async () => {
                const pass = authModal.passwordInput.trim();
                if (!window.crypto || !crypto.subtle) {
                    setAuthModal(prev => ({ ...prev, error: 'Verifica PIN non supportata da questo browser.' }));
                    return;
                }
                if (pass && await sha256Hex(PIN_SALT + pass) === PIN_HASH) {
                    setActiveTab(authModal.targetTab);
                    setAuthModal({ open: false, targetTab: '', requiredRole: '', passwordInput: '', error: '' });
                } else {
                    setAuthModal(prev => ({ ...prev, error: 'PIN errato!', passwordInput: '' }));
                }
            };

            // Gestione Tavoli e Soci
            const handleSelectTable = (table) => {
                setSelectedTable(table);
                const sitting = tableMembersMap[table] || [];
                if (sitting.length > 0) {
                    setActiveCustomer(sitting[0]);
                } else {
                    setActiveCustomer('');
                }
                const existingOpenTab = openTabs.find(t => t.table === table);
                if (existingOpenTab) {
                    setCart(existingOpenTab.items);
                } else {
                    setCart([]);
                }
            };

            const toggleMemberAtCurrentTable = (memberName) => {
                setTableMembersMap(prev => {
                    const current = prev[selectedTable] || [];
                    let updated;
                    if (current.includes(memberName)) {
                        updated = current.filter(m => m !== memberName);
                    } else {
                        updated = [...current, memberName];
                    }
                    if (updated.length > 0) {
                        if (!updated.includes(activeCustomer)) {
                            setActiveCustomer(updated[0]);
                        }
                    } else {
                        setActiveCustomer('');
                    }
                    return { ...prev, [selectedTable]: updated };
                });
            };

            // Gestione Carrello POS
            const addToCart = (product) => {
                if (applyToAllMembers && currentSittingMembers.length > 0) {
                    setCart(prev => {
                        let updated = [...prev];
                        currentSittingMembers.forEach(member => {
                            const cartItemId = `${product.id}_${member}_${Date.now()}_${Math.random()}`;
                            const existingIndex = updated.findIndex(item => item.id === product.id && item.assignedCustomer === member);
                            if (existingIndex > -1) {
                                updated[existingIndex] = { ...updated[existingIndex], qty: updated[existingIndex].qty + 1 };
                            } else {
                                updated.push({ ...product, cartItemId, qty: 1, assignedCustomer: member });
                            }
                        });
                        return updated;
                    });
                    return;
                }

                const currentMember = activeCustomer || (currentSittingMembers.length > 0 ? currentSittingMembers[0] : 'Socio');
                const cartItemId = `${product.id}_${currentMember}_${Date.now()}`;

                setCart(prev => {
                    const existingIndex = prev.findIndex(item => item.id === product.id && item.assignedCustomer === currentMember);
                    if (existingIndex > -1) {
                        return prev.map((item, idx) => idx === existingIndex ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, cartItemId, qty: 1, assignedCustomer: currentMember }];
                });
            };

            const addCustomPriceToCart = (amount) => {
                if (applyToAllMembers && currentSittingMembers.length > 0) {
                    setCart(prev => {
                        let updated = [...prev];
                        currentSittingMembers.forEach(member => {
                            const extraProduct = {
                                id: `extra_${Date.now()}_${Math.random()}`,
                                name: 'EXTRA',
                                category: 'Extra',
                                price: amount,
                                color: 'bg-slate-800 text-amber-400 border-amber-400'
                            };
                            const cartItemId = `extra_${Date.now()}_${member}_${Math.random()}`;
                            updated.push({ ...extraProduct, cartItemId, qty: 1, assignedCustomer: member });
                        });
                        return updated;
                    });
                    return;
                }

                const currentMember = activeCustomer || (currentSittingMembers.length > 0 ? currentSittingMembers[0] : 'Socio');
                const extraProduct = {
                    id: `extra_${Date.now()}_${Math.random()}`,
                    name: 'EXTRA',
                    category: 'Extra',
                    price: amount,
                    color: 'bg-slate-800 text-amber-400 border-amber-400'
                };
                const cartItemId = `extra_${Date.now()}_${currentMember}`;
                setCart(prev => [...prev, { ...extraProduct, cartItemId, qty: 1, assignedCustomer: currentMember }]);
            };

            const updateCartQtyByCartItemId = (cartItemId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartItemId === cartItemId) {
                        const newQty = item.qty + delta;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const updateItemCustomer = (cartItemId, newCustomer) => {
                setCart(prev => prev.map(item => item.cartItemId === cartItemId ? { ...item, assignedCustomer: newCustomer } : item));
            };

            const saveOpenTab = () => {
                if (cart.length === 0) return;
                const existingIndex = openTabs.findIndex(t => t.table === selectedTable);
                const updatedTab = {
                    id: existingIndex > -1 ? openTabs[existingIndex].id : Date.now(),
                    table: selectedTable,
                    items: cart,
                    total: cartTotal,
                    time: currentDateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    members: currentSittingMembers
                };

                if (existingIndex > -1) {
                    setOpenTabs(prev => prev.map((t, i) => i === existingIndex ? updatedTab : t));
                } else {
                    setOpenTabs(prev => [...prev, updatedTab]);
                }

                setCart([]);
                setSelectedTable('Banco');
                alert(`Conto per ${selectedTable} salvato con successo!`);
            };

            const openCheckoutCurrentCart = () => {
                if (cart.length === 0) return;
                setCheckoutModal({
                    open: true,
                    order: {
                        id: Date.now(),
                        table: selectedTable,
                        items: cart,
                        total: cartTotal
                    },
                    amountTendered: '',
                    change: 0,
                    selectedCustomerToPay: 'ALL'
                });
            };

            const confirmPayment = () => {
                if (!checkoutModal.order) return;
                const targetCustomer = checkoutModal.selectedCustomerToPay;

                if (targetCustomer === 'ALL') {
                    // Incasso totale tavolo
                    const saleRecord = {
                        id: Date.now(),
                        time: currentDateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        table: checkoutModal.order.table,
                        customerName: 'Intero Tavolo',
                        items: checkoutModal.order.items,
                        total: checkoutModal.order.total
                    };
                    setSalesHistory(prev => [saleRecord, ...prev]);
                    setOpenTabs(prev => prev.filter(t => t.table !== checkoutModal.order.table));
                    if (selectedTable === checkoutModal.order.table) {
                        setCart([]);
                        setTableMembersMap(prev => ({ ...prev, [selectedTable]: [] }));
                        setActiveCustomer('');
                        setSelectedTable('Banco');
                    }
                } else {
                    // Incasso singolo socio
                    const memberItems = checkoutModal.order.items.filter(i => (i.assignedCustomer || 'Socio') === targetCustomer);
                    const memberTotal = memberItems.reduce((sum, i) => sum + i.price * i.qty, 0);

                    if (memberItems.length === 0) return;

                    const saleRecord = {
                        id: Date.now(),
                        time: currentDateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        table: checkoutModal.order.table,
                        customerName: targetCustomer,
                        items: memberItems,
                        total: memberTotal
                    };
                    setSalesHistory(prev => [saleRecord, ...prev]);

                    // Identifica gli articoli rimanenti degli ALTRI soci al tavolo
                    const remainingItems = checkoutModal.order.items.filter(i => (i.assignedCustomer || 'Socio') !== targetCustomer);

                    // Aggiorna il carrello attivo se stiamo lavorando su questo tavolo
                    if (selectedTable === checkoutModal.order.table) {
                        setCart(remainingItems);
                    }

                    // Rimuovi il socio dalla lista dei soci seduti al tavolo
                    setTableMembersMap(prev => {
                        const targetTable = checkoutModal.order.table;
                        const currentMembers = prev[targetTable] || [];
                        const updatedMembers = currentMembers.filter(m => m !== targetCustomer);

                        if (activeCustomer === targetCustomer) {
                            setActiveCustomer(updatedMembers.length > 0 ? updatedMembers[0] : '');
                        }

                        return {
                            ...prev,
                            [targetTable]: updatedMembers
                        };
                    });

                    // Aggiorna o rimuovi il conto nei Conti Aperti
                    setOpenTabs(prev => {
                        if (remainingItems.length === 0) {
                            return prev.filter(t => t.table !== checkoutModal.order.table);
                        } else {
                            const newTotal = remainingItems.reduce((s, i) => s + i.price * i.qty, 0);
                            return prev.map(t => t.table === checkoutModal.order.table ? { ...t, items: remainingItems, total: newTotal } : t);
                        }
                    });
                }

                setCheckoutModal({ open: false, order: null, amountTendered: '', change: 0, selectedCustomerToPay: 'ALL' });
            };

            // Gestione Prodotti Anagrafica
            const handleSaveProduct = () => {
                if (!prodForm.name.trim() || !prodForm.price) return;
                const priceNum = parseFloat(prodForm.price);
                if (isNaN(priceNum)) return;

                if (prodForm.id) {
                    setProducts(prev => prev.map(p => p.id === prodForm.id ? { ...p, name: prodForm.name, category: prodForm.category, price: priceNum } : p));
                } else {
                    const newProd = {
                        id: Date.now(),
                        name: prodForm.name.trim(),
                        category: prodForm.category,
                        price: priceNum,
                        color: 'bg-amber-500 hover:bg-amber-400 text-slate-950 border-amber-300'
                    };
                    setProducts(prev => [...prev, newProd]);
                }
                setProdForm({ id: null, name: '', category: 'Birre', price: '', color: 'bg-amber-500 hover:bg-amber-400 text-slate-950 border-amber-300' });
            };

            const handleDeleteProduct = (id) => {
                setProducts(prev => prev.filter(p => p.id !== id));
            };

            // Gestione Anagrafica Soci
            const handleAddNewMember = () => {
                if (!newMemberName.trim()) return;
                const nameClean = newMemberName.trim();
                if (!customerList.includes(nameClean)) {
                    setCustomerList(prev => [...prev, nameClean].sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' })));
                }
                setNewMemberName('');
            };

            const handleDeleteCustomer = (name) => {
                setCustomerList(prev => prev.filter(c => c !== name));
            };

            const deleteOpenTab = (id) => {
                setOpenTabs(prev => prev.filter(t => t.id !== id));
            };

            const handlePerformDailyClosure = () => {
                const totalSales = totalDailySales;
                const presidentVal = parseFloat(closureForm.presidentAmount) || totalSales;
                const grandTotalInRegister = initialFund + totalSales;
                const remainingFundForTomorrow = Math.max(0, grandTotalInRegister - presidentVal);

                const newClosure = {
                    id: Date.now(),
                    date: currentDateTime.toLocaleDateString(),
                    time: currentDateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    cashierName: closureForm.cashierName || 'Operatore Cassa',
                    initialFund: initialFund,
                    totalSales: totalSales,
                    presidentAmount: presidentVal,
                    reasonNotes: closureForm.reasonNotes || 'Consegna Incasso',
                    newInitialFundForNextDay: remainingFundForTomorrow
                };

                setDailyClosuresHistory(prev => [newClosure, ...prev]);
                setInitialFund(remainingFundForTomorrow);
                setSalesHistory([]);
                setClosureForm(prev => ({ ...prev, presidentAmount: '' }));

                alert(`Chiusura Cassa completata!\n\nImporto versato al Presidente: € ${presidentVal.toFixed(2)}\nFondo Cassa per domani aggiornato a: € ${remainingFundForTomorrow.toFixed(2)}`);
            };

            const handleDeleteClosure = (id) => {
                setDailyClosuresHistory(prev => prev.filter(c => c.id !== id));
            };

            const handleExportBackup = () => {
                const data = {
                    products,
                    customerList,
                    openTabs,
                    salesHistory,
                    dailyClosuresHistory,
                    initialFund,
                    clubName,
                    registerName,
                    tableMembersMap
                };
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_cassa_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.products) setProducts(data.products);
                        if (data.customerList) setCustomerList(data.customerList);
                        if (data.openTabs) setOpenTabs(data.openTabs);
                        if (data.salesHistory) setSalesHistory(data.salesHistory);
                        if (data.dailyClosuresHistory) setDailyClosuresHistory(data.dailyClosuresHistory);
                        if (data.initialFund) setInitialFund(data.initialFund);
                        if (data.clubName) setClubName(data.clubName);
                        if (data.registerName) setRegisterName(data.registerName);
                        if (data.tableMembersMap) setTableMembersMap(data.tableMembersMap);
                        alert('Backup ripristinato con successo!');
                    } catch (err) {
                        alert('Errore nel formato del file di backup!');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-28 lg:pb-10">
                    {/* INTESTAZIONE E BARRA SUPERIORE IN BLU ELETTRICO */}
                    <header className="bg-blue-600 border-b border-blue-500 px-4 py-3 sticky top-0 z-40 shadow-xl">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-2 md:gap-3">
                            <div className="flex items-center gap-3">
                                <div>
                                    {isEditingHeader ? (
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={clubName}
                                                onChange={e => setClubName(e.target.value)}
                                                className="bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs font-black text-amber-400"
                                            />
                                            <input
                                                type="text"
                                                value={registerName}
                                                onChange={e => setRegisterName(e.target.value)}
                                                className="bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs text-white"
                                            />
                                            <button onClick={() => setIsEditingHeader(false)} className="bg-amber-400 text-slate-950 px-2 py-1 rounded font-black text-xs">OK</button>
                                        </div>
                                    ) : (
                                        <div onClick={() => setIsEditingHeader(true)} className="cursor-pointer group">

                                        );
                                    })()}
                                </div>

                                <div className="sticky -bottom-4 sm:-bottom-5 -mx-4 sm:-mx-5 -mb-4 sm:-mb-5 px-4 sm:px-5 pt-3 pb-4 sm:pb-5 bg-slate-900 border-t border-slate-800">
                                    <button onClick={confirmPayment} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm py-3.5 rounded-2xl transition shadow-lg uppercase tracking-wider">
                                        CONFERMA INCASSO
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
